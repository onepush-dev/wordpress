; Railway template PHP tuning (loaded after the image's opcache-recommended.ini, so it wins).
; ${VAR} values come from service variables (defaults are baked into the image).

memory_limit = ${PHP_MEMORY_LIMIT}
upload_max_filesize = ${PHP_UPLOAD_LIMIT}
post_max_size = ${PHP_UPLOAD_LIMIT}
max_execution_time = ${PHP_MAX_EXECUTION_TIME}
max_input_time = ${PHP_MAX_EXECUTION_TIME}
max_input_vars = 5000
expose_php = Off

; Fewer stat() calls per request
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; OPcache: room for WordPress + WooCommerce-sized plugin sets, re-check changed files once a minute.
; WordPress invalidates OPcache itself when it updates core, plugins or themes.
opcache.enable = 1
opcache.memory_consumption = ${PHP_OPCACHE_MEMORY}
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 32531
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
opcache.save_comments = 1
opcache.enable_file_override = 1
opcache.max_wasted_percentage = 10
