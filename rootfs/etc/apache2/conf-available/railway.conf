# Railway template Apache settings.

# Healthcheck: PHP + database, outside the document root, no WordPress bootstrap, no redirects.
Alias /healthz /usr/local/share/railway/healthz.php
<Directory /usr/local/share/railway>
	Options None
	AllowOverride None
	Require all granted
</Directory>
<Directory /usr/local/share/railway/mu-plugins>
	Require all denied
</Directory>

# Railway's edge proxies come from 100.64.0.0/10 (and fd00::/8 on the private network): trust their
# X-Forwarded-For so WordPress, comments and security plugins see the real client IP.
RemoteIPInternalProxy 100.64.0.0/10
RemoteIPInternalProxy fd00::/8

# Silences AH00558 (the real host name comes from each request).
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Recycle PHP workers now and then (bounds memory growth from leaky plugins).
<IfModule mpm_prefork_module>
	MaxConnectionsPerChild 1000
</IfModule>

# Brotli for text responses (gzip via mod_deflate stays enabled as the fallback).
<IfModule mod_brotli.c>
	AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/xml text/css text/javascript application/javascript application/json application/ld+json application/xml application/rss+xml application/atom+xml image/svg+xml font/ttf font/otf application/vnd.ms-fontobject
	BrotliCompressionQuality 5
</IfModule>

# Long-lived browser/CDN caching for static files (WordPress versions its CSS/JS URLs with ?ver=).
<IfModule mod_expires.c>
	<FilesMatch "\.(?i:css|js|mjs|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|mp4|webm|mp3|pdf)$">
		ExpiresActive On
		ExpiresDefault "access plus 30 days"
		Header append Cache-Control "public"
	</FilesMatch>
</IfModule>

# Don't serve files that only leak version info or config.
<FilesMatch "^(?i:readme\.html|license\.txt|wp-config\.php|wp-config-docker\.php|\.user\.ini)$">
	Require all denied
</FilesMatch>
